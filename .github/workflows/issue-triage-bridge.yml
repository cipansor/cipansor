# Re-triage an issue after another automation has responded, or after new
# activity.
#
# Why: nothing in the fleet fires on `issues.edited` or on a new comment, so a
# reporter who edits an issue description, or a maintainer who answers a
# `question`, got no re-triage until the hourly sweep happened to pick it up
# (#818, #1084). The triage owner is dispatched deterministically instead:
#
#   labeled -> a bot applied a type or priority label; the labeler responded, so
#              the triage owner studies the issue and the bot's comment. The
#              labeler's burst of labels collapses to one dispatch per
#              type+priority state (a marker comment).
#   comment -> a non-fleet account commented on an open issue. This is the
#              event-driven path for a maintainer's reply (#1084): before it, a
#              reply waited behind the sweep's ~40-candidate queue. A burst on
#              one issue collapses to one dispatch per BURST_WINDOW.
#   edited  -> a non-fleet account edited an issue's body (#1084). The fleet's
#              own body PATCHes (`basmalah`, `issue-label-sync`) post as
#              `github-actions[bot]` and are ignored by the anti-loop guard.
#   sweep   -> an open, not-`ready`, not-`in-progress` issue's activity signal
#              (body + non-fleet comments) changed since the bridge's last
#              checkpoint. The safety net behind the event paths, so an event the
#              workflow missed (or one that arrived while the pool was full) is
#              still caught. The description is never touched by this workflow.
#              A dispatch deferred while the pool was full (`pending`) is queued
#              with its first-deferral time; the sweep also discovers these from
#              the store and takes the oldest wait first (FIFO), so a deferred
#              issue cannot starve below the activity-ordered search window
#              (#872).
#   recover -> a `ready` issue whose sweep marker is not final. The sweep
#              searches `-label:ready`, so without this pass a marker on a
#              `ready` issue is never examined again: a deferred label dispatch
#              (`pending`) would sit forever, and a recovered run that then fails
#              would never be retried (#837 R348, R474). It discovers candidate
#              issues by scanning the marker comments, not a `ready`-issue search
#              bounded by update time (which would forget an old marker, #837
#              R475), then re-reads each issue's *own* latest marker to confirm
#              the marker belongs to it — a comment that merely quotes the
#              syntax names an unrelated issue and is ignored (#837 R512). Only
#              the dispatches per pass are capped. A final checkpoint is skipped,
#              so a new comment on a `ready` issue is not re-triaged (#837 R496).
#
# `ready` and `in-progress` issues are out of scope on every path (#1083): both
# end the triage episode. The one way back in is a maintainer's `@cipansor-bot`
# mention, which asks for a specific correction.
#
# The signal is content, not a timestamp, so a same-second edit is still caught.
# The triage owner is idempotent, so a duplicate dispatch is not a duplicate
# comment; the markers only save runs. A marker is written only after the
# dispatch is accepted, so a failure is retried by the next sweep. The rules live
# in .github/scripts/issue-triage-bridge.sh so they can be run by hand.
name: Issue triage bridge

on:
  issues:
    types: [labeled, edited]
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 * * * *' # hourly, off the top of the hour (gate-watch uses :23)
  workflow_dispatch:
    inputs:
      mode:
        description: 'sweep (default) or purge-markers (delete the legacy marker comments)'
        required: false
        default: sweep
        type: choice
        options: [sweep, purge-markers]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-bridge-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  labeled:
    name: Dispatch triage after a bot's label
    if: github.event_name == 'issues' && github.event.action == 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Dispatch the triage owner for the labelled issue
        env:
# Posted as `cipansor-bot`, not `github-actions[bot]`: this automation only
          # comments/labels/closes on issues and PRs, so the fleet's account should own it.
          # The fallback keeps the workflow working before the secret exists.
          GH_TOKEN: ${{ secrets.CIPANSOR_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
        run: sh .github/scripts/issue-triage-bridge.sh --stdin < "$GITHUB_EVENT_PATH"

  # The event-driven paths (#1084): a new comment, or an edited issue body. Both
  # read the event from the same file and share the guard set in the script
  # (anti-loop, lifecycle, burst, in-flight cap).
  activity:
    name: Dispatch triage after new issue activity
    if: github.event_name == 'issue_comment' || (github.event_name == 'issues' && github.event.action == 'edited')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Dispatch the triage owner for the new comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.CIPANSOR_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
        run: sh .github/scripts/issue-triage-bridge.sh --comment < "$GITHUB_EVENT_PATH"
      - name: Dispatch the triage owner for the edited issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.CIPANSOR_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
        run: sh .github/scripts/issue-triage-bridge.sh --edited < "$GITHUB_EVENT_PATH"

  sweep:
    name: Sweep not-ready issues with new activity
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Dispatch the triage owner for issues with activity since triage
        if: github.event.inputs.mode != 'purge-markers'
        env:
          GH_TOKEN: ${{ secrets.CIPANSOR_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
        run: sh .github/scripts/issue-triage-bridge.sh --sweep

      # A manual run to delete the legacy marker comments the pre-KV bridge left
      # behind, so the empty comments stop notifying subscribers. The bridge
      # itself never writes a comment; this only removes old ones.
      - name: Purge the legacy marker comments (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'purge-markers'
        env:
          GH_TOKEN: ${{ secrets.CIPANSOR_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
        run: sh .github/scripts/issue-triage-bridge.sh --purge-markers

      # The recovery pass for a label dispatch deferred while the pool was full
      # on an issue that is (or has become) `ready`. The sweep excludes `ready`
      # issues, so without this the pending marker would sit forever. It runs
      # even when the sweep step failed, so a sweep failure does not strand it.
      - name: Recover deferred label dispatches on ready issues
        if: always() && github.event.inputs.mode != 'purge-markers'
        env:
          GH_TOKEN: ${{ secrets.CIPANSOR_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
        run: sh .github/scripts/issue-triage-bridge.sh --recover-ready
