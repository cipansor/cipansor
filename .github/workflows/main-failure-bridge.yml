# Open one issue when a workflow on `main` fails.
#
# GitHub Actions is the deterministic bridge: it sees the finished result of
# every workflow on `main` and acts only while the run that failed is still the
# tip of `main` — so a failure mid-PR (which never has `main` as its branch)
# never raises an issue, and an older failure whose tip has already moved on is
# left to the event of the newer tip. This mirrors `pr-lifecycle.yml`, which
# dispatches the review gate.
#
# `Pemantau deployment` (SDLC 12) was retired on 2026-11-12 (owner decision): a
# red `main` is reported here, without an LLM sandbox, and a maintainer reads the
# cause from the run page. The rules live in
# `.github/scripts/main-failure-report.sh` so they can be run by hand.
name: Main failure bridge

on:
  # The code checks that run on a push to `main`: a failure there needs to be
  # visible. The deploys are NOT here: `deploy-watch.yml` reports a failed, hung
  # or wrong-commit deploy deterministically, and a deploy run skipped because
  # CI/E2E failed is the failure this bridge already reports. One problem, one
  # issue (decided 2026-10-10; docs/SDLC-FLOW.md → "Satu masalah, satu
  # peringatan").
  workflow_run:
    workflows: [CI, E2E Tests]
    types: [completed]

# `commits/main` is read with contents: read; the issue is opened with issues:
# write. Nothing here reads check runs.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  report:
    # head_branch alone also matches a fork's branch named `main` (its pull
    # request runs CI here); only a run of this repository's own main counts.
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Confirm the failure is still the tip of main
        id: gate
        env:
# Posted as `cipansor-bot`, not `github-actions[bot]`: this automation only
          # comments/labels/closes on issues and PRs, so the fleet's account should own it.
          # The fallback keeps the workflow working before the secret exists.
          GH_TOKEN: ${{ secrets.CIPANSOR_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The tip is read from the commit itself, not from check-runs: check
          # names carry the SHA (`CI and E2E passed on <sha>`) and the list has
          # dozens of entries, so matching a name is brittle. `commits/main`
          # returns the tip SHA directly. If it has moved past the run that
          # failed, a newer merge already superseded it — that tip's own failure
          # reports, not this stale one.
          TIP=$(gh api "repos/$REPO/commits/main" --jq .sha 2>/dev/null || echo "")
          echo "tip=$TIP failed=$FAILED_SHA"
          if [ -n "$TIP" ] && [ "$TIP" != "$FAILED_SHA" ]; then
            echo "main has moved past the failed run; skipping"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update the failure issue
        if: steps.gate.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.CIPANSOR_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: sh .github/scripts/main-failure-report.sh "$WORKFLOW" "$RUN_ID" "$SHA" "$RUN_URL" "$BRANCH"
