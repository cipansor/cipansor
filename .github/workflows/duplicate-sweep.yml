# A duplicate ISSUE gets one warning, then closes if the author does not show it
# is not a duplicate within seven days.
#
# "Show it is not a duplicate" means: the description was edited, or the author
# replied and a maintainer removed the label. If neither happens, the issue
# closes. Removing the label at any point cancels the close, because the script
# re-reads the label on every run.
#
# Issues are labelled `duplicate`; PRs are labelled `duplicate-pr` (a PR must
# never carry the issue-lifecycle `duplicate` label). The triage automation
# applies `duplicate` and links the original. For a PR the label is applied
# deterministically by `pr-duplicate.sh` in the first step below: two open PRs
# that close the same issue means the newest one is a duplicate candidate. But a
# PR labelled `duplicate-pr` is NOT closed: which of two PRs is the more correct
# one (docs/LABELS.md, rule 4) is a maintainer's judgement, so this workflow
# enforces the close for issues only and leaves the PR label for a person.
name: Duplicate sweep

on:
  schedule:
    - cron: '30 1 * * *'   # 08:30 Asia/Jakarta, daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: duplicate-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep duplicates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Label a PR that duplicates another open PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: sh .github/scripts/pr-duplicate.sh
      - name: Warn and close stale duplicate issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GRACE_DAYS: '7'
        run: sh .github/scripts/duplicate-sweep.sh
