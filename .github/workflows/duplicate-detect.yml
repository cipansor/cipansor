# Flag an open issue as a duplicate of another open issue with the same
# normalised title, then let `duplicate-sweep.yml` own the warn-and-close.
#
# The duplicate lifecycle was half deterministic: `duplicate-sweep.sh` enforced
# the close, but *noticing* a duplicate was one instruction inside the `Triase
# issue` prompt (`SDLC 15`). A family no triage run noticed stayed open until a
# person closed it by hand — which is what happened to the older watchdog family
# (#944, #957 closed by hand; #958 sat open a day). This workflow is the missing
# deterministic detector.
#
# It runs on `issues.opened` so a repeat is caught the moment it is filed, and
# daily so a pair that became duplicates later (a reopened issue) is not missed.
# It only ever labels: closing is `duplicate-sweep.sh`'s job, after a warning and
# a grace period, and a maintainer's label removal cancels both.
#
# The rules live in `.github/scripts/duplicate-detect.sh` so they can be run by
# hand.
name: Duplicate detect

on:
  issues:
    types: [opened]
  schedule:
    - cron: '15 1 * * *'   # 08:15 Asia/Jakarta, daily (before duplicate-sweep at :30)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Every run scans the WHOLE open-issue list, not just the issue that triggered it,
# so two runs must never overlap: `issues.opened` for two issues at once (or a
# sweep beside an `opened`) would both read a sibling before either writes its
# marker and each would post the link. One group for all runs serialises them;
# `cancel-in-progress: false` lets a queued run finish rather than lose a label.
concurrency:
  group: duplicate-detect
  cancel-in-progress: false

jobs:
  detect:
    name: Flag a same-title duplicate
    # A fork inherits this file; its issues must not be labelled here.
    if: github.repository == 'cipansor/cipansor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Label an open issue that duplicates another open issue
        env:
# Posted as `cipansor-bot`, not `github-actions[bot]`: this automation only
          # comments/labels/closes on issues and PRs, so the fleet's account should own it.
          # The fallback keeps the workflow working before the secret exists.
          GH_TOKEN: ${{ secrets.CIPANSOR_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: sh .github/scripts/duplicate-detect.sh
