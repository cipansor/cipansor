name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review: a draft skips the suite (see `scope`), so marking it
    # ready has to start a run that does not.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: # Allow manual trigger

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '26'
  PNPM_VERSION: '12.11.2'

jobs:
  # Does this run need the suite at all? It is most of the pipeline's
  # minutes, and two kinds of change gain nothing from it: a DRAFT pull request
  # (still being pushed to; the suite runs when it is marked ready) and a
  # change with no code in it — documentation or agent tooling only, as
  # .github/scripts/change-scope.sh defines it (shared with CI and the staging
  # deploy). A push to main is measured against the last commit on which this
  # workflow passed, not its parent, so a run cancelled by a newer commit is
  # never silently skipped.
  #
  # Skipping is done with a job-level `if:` on purpose. A job skipped by its
  # condition reports success, so the required check "E2E Tests (Chromium)"
  # is satisfied; a `paths:` filter on the trigger would skip the whole
  # workflow instead and leave that required check pending forever.
  scope:
    name: E2E scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if [ "$DRAFT" = "true" ]; then
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "scope: run=false — draft pull request; runs when marked ready"
              else
                sh .github/scripts/change-scope.sh pr "$PR"
              fi ;;
            push) sh .github/scripts/change-scope.sh since-pass e2e-tests.yml ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT"; echo "scope: $GITHUB_EVENT_NAME always runs" ;;
          esac

  # Primary gate: the full Playwright suite on Chromium against a real,
  # seeded backend (the app's primary target browser).
  e2e:
    name: E2E Tests (Chromium)
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write # for the report comment on PRs

    # The API reads these from the shell (its dotenv path is build-relative and
    # unreliable), so we set them job-wide rather than via a .env file.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cipansor_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-key-for-e2e-testing
      # Production default is 15m; e2e pins 7d because global-setup logs each
      # role in ONCE and reuses the tokens for the whole (up to 40-min) run.
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGIN: http://localhost:3000
      PORT: '3001'
      LOG_LEVEL: error
      # The e2e auth helper signs admin TOTPs from a known secret seeded when
      # E2E_FIXED_2FA=1; raise the 2FA limiter so the many logins don't trip it.
      TWO_FACTOR_RATE_LIMIT_MAX: '100000'
      # Same reason for the e-sign limiter: a spec that signs several letters
      # in one run would otherwise hit a cap meant to slow down guessing.
      ESIGN_RATE_LIMIT_MAX: '100000'
      # Baked into the web build: API base origin only (the app appends /api).
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Used by the e2e test runner, which builds full paths — keep the /api.
      API_URL: http://localhost:3001/api
      BASE_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cipansor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same cold-download risk as the cross-browser job below (see the note
      # there); Chromium is the required gate, so a slow CDN must not be able to
      # spend this job's 40-minute ceiling on the download.
      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(pnpm --filter web exec playwright --version | sed 's/^Version //')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "playwright $version"

      - name: Cache Playwright browsers (Chromium)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}

      - name: Install Playwright (Chromium)
        timeout-minutes: 15
        run: timeout --signal=TERM 840 pnpm --filter web exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Push database schema
        run: pnpm --filter api db:push

      - name: Seed database (with fixed-secret 2FA for admins)
        run: pnpm --filter api db:seed
        env:
          E2E_FIXED_2FA: '1'
          ALLOW_DESTRUCTIVE_SEED: '1'

      - name: Build shared + API + Web
        run: |
          pnpm --filter @cipansor/shared build
          pnpm --filter api build
          pnpm --filter web build
        env:
          # tsc on the full API surface exceeds Node's ~2GB default heap and
          # OOMs (exit 134); raise the limit (runners have plenty of RAM).
          NODE_OPTIONS: --max-old-space-size=4096

      # Web Push needs a VAPID key pair on the API, or the settings card reports
      # push unavailable and the subscribe/disable e2e cannot run. A pair made
      # for this job and thrown away with it — never a stored secret.
      - name: Generate a throwaway VAPID key pair
        run: |
          node -e "const c=require('crypto').createECDH('prime256v1');c.generateKeys();console.log('VAPID_PUBLIC_KEY='+c.getPublicKey('base64url'));console.log('VAPID_PRIVATE_KEY='+c.getPrivateKey('base64url'))" >> "$GITHUB_ENV"

      - name: Start API and wait for health
        run: |
          cd apps/api
          node dist/main.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          timeout 90 bash -c 'until curl -fs http://localhost:3001/health >/dev/null; do sleep 2; done' \
            || { echo "API did not become healthy"; cat /tmp/api.log; exit 1; }
          echo "API is healthy"

      # Playwright's webServer starts the production web server (`pnpm start`)
      # in CI; the API is already running above.
      - name: Run E2E tests
        run: pnpm --filter web exec playwright test --project=chromium

      - name: Stop API
        if: always()
        run: '[ -f /tmp/api.pid ] && kill "$(cat /tmp/api.pid)" || true'

      - name: Upload Playwright report
        if: always()
        continue-on-error: true # diagnostic artifact; storage-quota issues must not fail the gate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload test results (traces/screenshots)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7

      - name: Comment PR with test results
        # Cosmetic PR comment — never let it fail the gate (e.g. when an earlier
        # step failed and no report was produced). v3 takes the JSON report file.
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: daun/playwright-report-comment@5359ae22f265fd2dfdb7744a0cc6614c5c3abde6 # v4
        with:
          report-file: apps/web/test-results/results.json

  # Cross-browser coverage on main. Both engines are gates. WebKit became one in
  # #852 (its failures were real; a permanent red job under continue-on-error
  # taught people to stop reading it). Firefox followed in #1104: its named
  # flakes were real test defects (a navigation abort, a list that picked a
  # sibling spec's just-deleted row, a Radix option→fill race), now fixed, so it
  # blocks like WebKit instead of hiding a regression behind continue-on-error.
  e2e-cross-browser:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    # 75 minutes, not 45: the budget is the bounded 15-minute browser install
    # plus the 36-minute test timeout plus measured preparation and teardown
    # (#1148). At 45 the install cap and the test timeout could not both be
    # honoured, so a slow CDN still reached the ceiling and the job concluded
    # `cancelled`. The guard in main-failure-bridge.guard.test.ts checks that
    # these three numbers still fit; raising any one past the others fails it.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cipansor_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-key-for-e2e-testing
      # Production default is 15m; e2e pins 7d because global-setup logs each
      # role in ONCE and reuses the tokens for the whole (up to 40-min) run.
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGIN: http://localhost:3000
      PORT: '3001'
      LOG_LEVEL: error
      TWO_FACTOR_RATE_LIMIT_MAX: '100000'
      ESIGN_RATE_LIMIT_MAX: '100000'
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_URL: http://localhost:3001/api
      BASE_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cipansor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser download is the one preparation step whose duration this
      # repo does not control: it comes from Playwright's CDN, and on
      # 2026-11-18 the webkit download alone took 29m45s (against 34–62s in the
      # runs around it), pushing preparation to 33m13s and the job past its
      # `timeout-minutes` ceiling. A job killed at the ceiling concludes
      # `cancelled`, which nothing absorbs, so the run went `cancelled` and the
      # staging deploy was `skipped` with no report (#1148).
      #
      # The cache removes the cold download from the critical path: the key is
      # the Playwright version (the only thing that changes what gets
      # downloaded) plus the browser, so a hit installs in seconds and a miss
      # pays the download once. The version is read from the installed package,
      # not written here, so it cannot drift from the lockfile.
      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(pnpm --filter web exec playwright --version | sed 's/^Version //')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "playwright $version"

      - name: Cache Playwright browsers (${{ matrix.browser }})
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      # Bounded, and its failure absorbed, so a slow CDN can no longer reach the
      # job ceiling: the step stops at its own `timeout` (a failure, which the
      # run reports) instead of letting the runner kill the job (`cancelled`,
      # which it does not). `continue-on-error` keeps the run's verdict about
      # the tests: if the browser is missing the test step below fails on its
      # own, loudly, rather than this step turning a CDN stall into a red gate.
      - name: Install Playwright (${{ matrix.browser }})
        timeout-minutes: 15
        continue-on-error: true
        run: timeout --signal=TERM 840 pnpm --filter web exec playwright install --with-deps ${{ matrix.browser }}

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Push database schema
        run: pnpm --filter api db:push

      - name: Seed database (with fixed-secret 2FA for admins)
        run: pnpm --filter api db:seed
        env:
          E2E_FIXED_2FA: '1'
          ALLOW_DESTRUCTIVE_SEED: '1'

      - name: Build shared + API + Web
        run: |
          pnpm --filter @cipansor/shared build
          pnpm --filter api build
          pnpm --filter web build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Web Push needs a VAPID key pair on the API, or the settings card reports
      # push unavailable and the subscribe/disable e2e cannot run. A pair made
      # for this job and thrown away with it — never a stored secret.
      - name: Generate a throwaway VAPID key pair
        run: |
          node -e "const c=require('crypto').createECDH('prime256v1');c.generateKeys();console.log('VAPID_PUBLIC_KEY='+c.getPublicKey('base64url'));console.log('VAPID_PRIVATE_KEY='+c.getPrivateKey('base64url'))" >> "$GITHUB_ENV"

      - name: Start API and wait for health
        run: |
          cd apps/api
          node dist/main.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          timeout 90 bash -c 'until curl -fs http://localhost:3001/health >/dev/null; do sleep 2; done' \
            || { echo "API did not become healthy"; cat /tmp/api.log; exit 1; }

      # --max-failures: this job is informational, but a run that hits
      # timeout-minutes ends "cancelled", and a cancelled E2E run does not
      # trigger the staging deploy. On 2026-10-03 WebKit failed almost every
      # test (the CSP's upgrade-insecure-requests, #626); with three attempts
      # each it ran past 45 minutes and staging was never updated. Stopping
      # early keeps a broken engine a red, reported job instead.
      #
      # `timeout` on the command, not only the job ceiling (#915): `--max-failures`
      # only helps when the engine fails FAST. On 2026-10-20/22 WebKit ran the
      # full 45 minutes without reaching 30 failures — a slow, flaky engine — so
      # the JOB was killed at its ceiling, which concludes `cancelled`, and
      # `continue-on-error` does NOT absorb a cancellation: the run went
      # `cancelled`, the staging deploy was `skipped`, and nothing reported it.
      # Wrapping the command in `timeout` turns a hang into a step failure
      # (exit 124) that `continue-on-error` absorbs, so the run stays `success`.
      #
      # The `timeout-minutes` ceiling covers the WHOLE job, not just this step:
      # preparation (checkout, install, the bounded Playwright step, seed,
      # build, start the API) runs before the command and the post steps after
      # it, and only the command is under `timeout`. Measured across the 71
      # cross-browser jobs of the 60 most recent completed E2E runs
      # (2026-11-20): preparation 134–200s excluding the browser download,
      # teardown ≤10s, and the test step 167–1627s (p95 1339s). The download is
      # the one part whose duration this repo does not control, so it is bounded
      # by its own `timeout` (840s) instead of being assumed away, and the
      # ceiling is sized to hold all three: 200 + 840 + 2160 + 30 + 60 margin =
      # 3290s, inside the 4500s ceiling with ~1200s to spare. Before #1148 the
      # ceiling was 2700s and the download was unbounded, so a 29m45s download
      # consumed the ceiling and the job was killed — `cancelled`, not a
      # reported failure. The guard in main-failure-bridge.guard.test.ts holds
      # this budget and reads every number from this workflow, so raising one
      # past what the ceiling can absorb fails the test.
      - name: Run E2E tests (${{ matrix.browser }})
        run: timeout --signal=TERM 2160 pnpm --filter web exec playwright test --project=${{ matrix.browser }} --max-failures=30

      - name: Stop API
        if: always()
        run: '[ -f /tmp/api.pid ] && kill "$(cat /tmp/api.pid)" || true'

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report/
          retention-days: 7
