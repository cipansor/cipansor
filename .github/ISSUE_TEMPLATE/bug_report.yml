name: Laporan bug
description: Ada yang rusak atau berperilaku berbeda dari yang dimaksudkan.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ

        Terima kasih telah melapor. Dua kolom pertama saja sudah cukup untuk
        memulai; sisanya membantu bila Anda tahu. Automation `Triase issue`
        menetapkan tipe dan prioritas, lalu menandai issue ini `ready` begitu
        isinya cukup dikerjakan tanpa pertanyaan lanjutan — lihat
        [docs/LABELS.md](https://github.com/cipansor/cipansor/blob/main/docs/LABELS.md).

        Bila Anda hanya ingin tahu cara memakai aplikasi (bukan melaporkan
        kerusakan), pakai tautan "Cara memakai aplikasi" di halaman sebelumnya.

  - type: textarea
    id: what-happened
    attributes:
      label: Apa yang terjadi
      description: Satu atau dua kalimat. Perilaku yang Anda amati, bukan dugaan penyebabnya.
      placeholder: Tombol Simpan memutar terus dan data tidak tersimpan.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Apa yang Anda harapkan
      description: Perilaku yang seharusnya terjadi, dinyatakan seolah sudah berjalan.
      placeholder: Data tersimpan dan muncul notifikasi berhasil.
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Di mana masalahnya
      description: Bila tidak yakin, pilih "Tidak tahu".
      options:
        - Portal internal (portal.cipansor.or.id)
        - Situs publik (cipansor.or.id)
        - Aplikasi wali (Android/PWA)
        - Tidak tahu
    validations:
      required: false

  - type: input
    id: menu-path
    attributes:
      label: Menu atau halaman
      description: Jalan menuju layarnya, persis seperti di menu.
      placeholder: Perencanaan & Kinerja → Perjanjian Kinerja → Tambah
    validations:
      required: false

  - type: dropdown
    id: since
    attributes:
      label: Sejak kapan terjadi
      description: Pembeda regresi (baru) dari cacat lama — membantu menaksir penyebabnya.
      options:
        - Baru sejak perubahan terakhir
        - Sudah lama, tapi baru saya laporkan
        - Selalu begitu
        - Tidak tahu
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      description: |
        Langkah, perintah, atau permintaan persis yang bisa diikuti peninjau.
        Bila Anda tidak bisa mereproduksinya, sebutkan — automation
        `Reproduksi bug` yang akan melengkapinya, bukan alasan menolak laporan.
      value: |
        1.
        2.
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Siapa yang terdampak
      description: |
        Unit, peran, atau jumlah orang yang terhambat, dan apakah pekerjaannya
        terhenti atau masih ada cara lain. Inilah yang membuat prioritas dapat
        dibuktikan, bukan ditebak.
      placeholder: Bendahara unit tidak bisa menutup tagihan akhir bulan; 4 unit terdampak, tanpa cara lain.
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Lingkungan
      description: Di mana Anda melihat masalahnya.
      options:
        - Produksi (aplikasi yang dipakai sehari-hari)
        - Staging (uji coba)
        - Lokal (komputer sendiri)
        - Tidak tahu
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Peramban atau perangkat
      description: Bila hanya terjadi di satu peramban atau perangkat.
      placeholder: Chrome 131 di Android, atau Firefox 133 di Windows
    validations:
      required: false

  - type: upload
    id: screenshots
    attributes:
      label: Tangkapan layar
      description: Seret atau tempel gambar/video yang menunjukkan masalahnya. Wajib untuk cacat tampilan.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Log atau keluaran
      description: Pesan galat, keluaran konsol, atau respons API. Isinya otomatis dibungkus blok kode.
      render: shell
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Kriteria penerimaan
      description: |
        Hasil yang bisa diamati yang menunjukkan ini diperbaiki, sebagai kotak
        centang. Bila dikosongkan, `Triase issue` yang melengkapinya — issue
        tetap dapat ditandai `ready` tanpa kolom ini.
      value: |
        - [ ]
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Konteks tambahan
      description: Issue terkait, dugaan penyebab, solusi sementara, atau apa pun yang perlu diketahui pelaksana.
    validations:
      required: false
